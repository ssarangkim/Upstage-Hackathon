services:
  - type: web
    name: usedcar-record-demo
    runtime: python
    rootDir: demo_app
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: UPSTAGE_API_KEY
        sync: false
      - key: AGENT_ID
        value: agt_niiPU8ZjFMUTUjme4TaxUE
      - key: CONFIG_ID
        value: "2"
      - key: PYTHON_VERSION
        value: 3.13.5
